<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="GameLog"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>GameLog</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;color:#fff;background:#080b13}body:before{content:"";position:fixed;inset:-15%;z-index:-1;background:radial-gradient(ellipse at 10% 5%,var(--a,#432d6b) 0,transparent 45%),radial-gradient(ellipse at 90% 35%,var(--b,#093e42) 0,transparent 48%),#080b13;filter:blur(22px);transition:background 0.5s}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}header{padding:calc(env(safe-area-inset-top) + 24px) 22px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:23px;letter-spacing:-1px}.brand i{font-style:normal;color:#7df7d4}main{padding:14px 20px 120px;max-width:650px;margin:auto}h1{font-size:36px;letter-spacing:-1.6px;margin:16px 0 4px}h2{font-size:21px;letter-spacing:-.6px;margin:25px 0 12px}.muted{color:#a7a8b8}.small{font-size:13px}.glass{background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:inset 0 1px rgba(255,255,255,.1);border-radius:22px}.pill{border:1px solid #ffffff30;background:#ffffff16;border-radius:30px;padding:10px 15px}.primary{background:#b4f6e6;color:#07231c;border:0;font-weight:700}.hero{padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(140deg,#9b5bf440,#00bba52b);margin-top:18px}.hero strong{font-size:43px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.game{position:relative;min-width:0}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:17px;background:linear-gradient(145deg,#27374e,#18212f);display:block}.fallback{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:20px;font-weight:800}.game-name{font-size:13px;font-weight:650;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{position:absolute;right:8px;bottom:35px;border-radius:11px;padding:8px 10px;font-weight:900;font-size:18px;box-shadow:0 4px 20px #0009}.green{background:#1aaf6a}.yellow{background:#e3b13e;color:#241a00}.red{background:#d8494c}.tabbar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);width:min(94%,450px);display:flex;justify-content:space-around;align-items:center;padding:9px 5px;z-index:10;background:#242732c9;border:1px solid #ffffff32;border-radius:29px;backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px)}.tabbar button{border:0;background:none;display:flex;flex-direction:column;gap:3px;align-items:center;color:#b3b4c1;font-size:11px;min-width:54px}.tabbar button.active{color:#a6ffdc}.tabbar b{font-size:22px;font-weight:500}.tabbar .add{border-radius:50%;width:46px;height:46px;background:#b4f6e6;color:#102d24;font-size:30px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.years{display:flex;gap:8px;overflow:auto;padding:6px 0 13px}.years button.active{background:#a9f6dd;color:#06251e}.empty{padding:40px 20px;text-align:center;color:#bcbac9}.panel{padding:20px;margin-top:15px}label{display:block;font-size:13px;color:#c7c6d2;margin:15px 0 7px}input,select,textarea{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff30;background:#ffffff15;color:white;outline:none}select option{color:#111}textarea{resize:vertical}input[type=range]{accent-color:#b5f5dc;padding:0}.full{width:100%;padding:14px;margin-top:18px;border-radius:16px}.modal{position:fixed;inset:0;background:#050810e8;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 40px);backdrop-filter:blur(25px)}.modal-inner{max-width:550px;margin:auto}.hidden{display:none!important}.choice{border-radius:15px;padding:11px;background:#ffffff12;border:1px solid #ffffff20}.choice.active{border-color:#9affd8}.coverchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.coverchoices img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px}.coverchoices button{padding:0;background:none;border:2px solid transparent;border-radius:12px}.coverchoices button.active{border-color:#a4ffe0}.detail-cover{display:block;max-height:360px;max-width:78%;object-fit:contain;margin:18px auto;border-radius:20px;box-shadow:0 25px 60px #0009}.stat{padding:18px;flex:1;min-width:120px}.stat strong{display:block;font-size:30px}.notice{font-size:12px;color:#b5b2c6;line-height:1.5}.search-result{padding:12px;border-bottom:1px solid #ffffff1b;display:flex;justify-content:space-between;align-items:center;gap:10px}
</style></head><body><header><div class="brand">✦ Game<i>Log</i></div><button class="pill" id="searchBtn" aria-label="Buscar">⌕</button></header><main id="main"></main><nav class="tabbar"><button data-tab="home" class="active"><b>⌂</b>Inicio</button><button data-tab="played"><b>▦</b>Jugados</button><button class="add" id="addBtn" aria-label="Agregar juego">+</button><button data-tab="backlog"><b>▤</b>Backlog</button><button data-tab="stats"><b>▥</b>Datos</button></nav><div id="modal" class="modal hidden"></div><script>
const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let games=JSON.parse(localStorage.getItem('gamelog-v1')||'[]'),tab='home',year=new Date().getFullYear(),editing=null,chosenCover='',covers=[],apiKey=localStorage.getItem('gamelog-api')||'',rawgKey=localStorage.getItem('gamelog-rawg-api')||'',rawgTimer=null,rawgController=null;function save(){localStorage.setItem('gamelog-v1',JSON.stringify(games))}function color(n){return n>=75?'green':n>=50?'yellow':'red'}function setAmbient(a,b){document.body.style.setProperty('--a',a);document.body.style.setProperty('--b',b)}function card(g){return '<div class="game" data-id="'+g.id+'">'+(g.cover?'<img class="poster" loading="lazy" src="'+escapeHtml(g.cover)+'">':'<div class="poster fallback">'+escapeHtml(g.title)+'</div>')+(g.status==='played'?'<span class="score '+color(g.score)+'">'+g.score+'</span>':'')+'<div class="game-name">'+escapeHtml(g.title)+'</div></div>'}function grid(arr){return arr.length?'<div class="grid">'+arr.map(card).join('')+'</div>':'<div class="glass empty">Todavía no hay juegos acá.<p>Agregá el primero con el botón +</p></div>'}function render(){let played=games.filter(g=>g.status==='played'),pending=games.filter(g=>g.status==='backlog');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let out='';if(tab==='home'){setAmbient('#4c235b','#07555a');out='<div class="muted small">TU HISTORIA JUGANDO</div><h1>Tu universo gamer.</h1><p class="muted">Todos tus juegos, en un solo lugar.</p><div class="glass hero"><span class="muted">Mi colección</span><strong>'+games.length+' juegos</strong><span>'+played.length+' jugados · '+pending.length+' pendientes</span></div><h2>Jugados recientemente</h2>'+grid(played.slice().sort((a,b)=>b.id-a.id).slice(0,4))+'<h2>Por descubrir</h2>'+grid(pending.slice(-4).reverse())}if(tab==='played'){setAmbient('#06483d','#14365d');let ys=[...new Set([year,...played.map(g=>g.year)])].sort((a,b)=>b-a);out='<div class="muted small">MI HISTORIAL</div><h1>Jugados</h1><div class="years">'+ys.map(y=>'<button class="pill '+(year===y?'active':'')+'" data-year="'+y+'">'+y+'</button>').join('')+'</div><p class="muted small">'+played.filter(g=>g.year===year).length+' juegos en '+year+'</p>'+grid(played.filter(g=>g.year===year).sort((a,b)=>b.score-a.score))}if(tab==='backlog'){setAmbient('#4d1d68','#14265c');out='<div class="muted small">PRÓXIMAS AVENTURAS</div><h1>Backlog</h1><p class="muted">'+pending.length+' juegos por descubrir</p>'+grid(pending.slice().reverse())}if(tab==='stats'){setAmbient('#50215d','#064b57');let avg=played.length?Math.round(played.reduce((a,g)=>a+g.score,0)/played.length):0;out='<div class="muted small">TU AÑO EN JUEGOS</div><h1>Estadísticas</h1><div class="row"><div class="glass stat"><span class="muted small">Jugados</span><strong>'+played.length+'</strong></div><div class="glass stat"><span class="muted small">Nota media</span><strong>'+avg+'</strong></div></div><h2>Por puntuación</h2><div class="row">'+['green','yellow','red'].map((c,i)=>'<div class="glass stat"><span class="muted small">'+['75–100','50–74','1–49'][i]+'</span><strong style="color:'+['#45df9a','#e3b13e','#e86b6b'][i]+'">'+played.filter(g=>color(g.score)===c).length+'</strong></div>').join('')+'</div><h2>Juegos por año</h2>'+[...new Set(played.map(g=>g.year))].sort((a,b)=>b-a).map(y=>'<div class="glass panel row between"><b>'+y+'</b><span>'+played.filter(g=>g.year===y).length+' juegos</span></div>').join('')+'<h2>Mis datos</h2><button class="pill" id="exportBtn">Exportar copia JSON</button> <button class="pill" id="importBtn">Importar copia</button><input type="file" id="importFile" accept=".json,application/json" hidden><p class="notice">Tus juegos se guardan en este dispositivo. Exportá copias regularmente: iOS puede eliminar datos del navegador.</p><h2>Portadas SteamGridDB</h2><button class="pill" id="apiBtn">Configurar clave API</button>'}$('#main').innerHTML=out;document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(Number(el.dataset.id)));document.querySelectorAll('[data-year]').forEach(el=>el.onclick=()=>{year=Number(el.dataset.year);render()});if($('#exportBtn'))$('#exportBtn').onclick=exportData;if($('#importBtn'))$('#importBtn').onclick=()=>$('#importFile').click();if($('#importFile'))$('#importFile').onchange=importData;if($('#rawgApiBtn'))$('#rawgApiBtn').onclick=configureRawg;if($('#apiBtn'))$('#apiBtn').onclick=configureApi}document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render();window.scrollTo(0,0)});$('#addBtn').onclick=()=>editor();$('#searchBtn').onclick=()=>{let q=prompt('Buscar en tu biblioteca');if(q===null)return;let hits=games.filter(g=>g.title.toLowerCase().includes(q.toLowerCase()));$('#main').innerHTML='<h1>Resultados</h1>'+grid(hits);document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(Number(el.dataset.id)))};function openModal(html){$('#modal').classList.remove('hidden');$('#modal').innerHTML='<div class="modal-inner"><div class="row between"><button class="pill" id="closeModal">✕ Cerrar</button><span class="muted small">GameLog</span></div>'+html+'</div>';$('#closeModal').onclick=closeModal}function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}function editor(id){editing=id||null;let g=games.find(x=>x.id===id)||{title:'',year:new Date().getFullYear(),score:85,status:'played',description:'',cover:''};chosenCover=g.cover||'';covers=[];openModal('<h1>'+(id?'Editar juego':'Agregar juego')+'</h1><div class="glass panel" style="margin-bottom:14px"><b>🎮 Buscar en el catálogo de videojuegos</b><p class="notice">Buscá en RAWG para completar automáticamente el nombre, la portada, las plataformas y el lanzamiento. Necesita una clave API gratuita.</p><div class="row"><input id="rawgSearch" placeholder="Ej. Zelda, Resident Evil, GTA..." style="flex:1;min-width:150px"><button class="pill" id="rawgSettings" type="button">⚙ Clave</button></div><div id="rawgResults" aria-live="polite"></div></div><label>Nombre del videojuego</label><input id="titleInput" placeholder="Ej. Zelda: Ocarina of Time" value="'+escapeHtml(g.title)+'"><button class="pill" style="margin-top:10px" id="findCover">Buscar portadas en SteamGridDB</button><div id="coverResults"></div><label>O pegar URL de portada</label><input id="coverInput" placeholder="https://..." value="'+escapeHtml(chosenCover)+'"><label>O subir portada desde Fotos</label><input type="file" id="photoInput" accept="image/*"><label>Estado</label><select id="statusInput"><option value="played">Jugado</option><option value="backlog">Pendiente</option></select><label>Año jugado</label><input type="number" id="yearInput" min="1970" max="2100" value="'+g.year+'"><label>Mi nota: <strong id="scoreLabel">'+g.score+'</strong></label><input id="scoreInput" type="range" min="1" max="100" value="'+g.score+'"><label>Comentario (opcional)</label><textarea id="descInput" rows="3">'+escapeHtml(g.description)+'</textarea><button class="full primary" id="saveGame">Guardar videojuego</button>');$('#rawgSettings').onclick=configureRawg;$('#rawgSearch').oninput=e=>{clearTimeout(rawgTimer);let q=e.target.value.trim();if(q.length<2){$('#rawgResults').innerHTML='<p class="notice">Escribí al menos 2 letras.</p>';return}rawgTimer=setTimeout(()=>searchRawg(q),350)};$('#statusInput').value=g.status;$('#scoreInput').oninput=()=>$('#scoreLabel').textContent=$('#scoreInput').value;$('#findCover').onclick=findCovers;$('#photoInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,600/img.width);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);chosenCover=c.toDataURL('image/jpeg',.78);$('#coverInput').value='[Portada local seleccionada]'};img.src=URL.createObjectURL(f)};$('#saveGame').onclick=()=>{let title=$('#titleInput').value.trim();if(!title)return alert('Escribí el nombre del juego');let url=$('#coverInput').value.trim(),cover=url.startsWith('http')?url:chosenCover;let entry={id:id||Date.now(),title,cover,status:$('#statusInput').value,year:Number($('#yearInput').value),score:Number($('#scoreInput').value),description:$('#descInput').value};games=id?games.map(x=>x.id===id?entry:x):[...games,entry];try{save()}catch(e){alert('No se pudo guardar: almacenamiento lleno. Probá con una imagen más pequeña.');return}closeModal();render()}}async function findCovers(){let q=$('#titleInput').value.trim();if(!q)return alert('Ingresá un nombre');if(!apiKey){configureApi();return}$('#coverResults').innerHTML='<p class="muted">Buscando portadas...</p>';try{let r=await fetch('https://www.steamgriddb.com/api/v2/search/autocomplete/'+encodeURIComponent(q),{headers:{Authorization:'Bearer '+apiKey}});if(!r.ok)throw Error('Error '+r.status);let j=await r.json(),items=j.data||[];$('#coverResults').innerHTML=items.slice(0,6).map(x=>'<button class="pill" data-game="'+x.id+'">'+escapeHtml(x.name)+'</button>').join(' ')||'Sin resultados';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>loadCovers(b.dataset.game))}catch(e){$('#coverResults').innerHTML='<p class="notice">No se pudo conectar con SteamGridDB ('+escapeHtml(e.message)+'). Podés usar una URL o una imagen de Fotos. La API puede bloquear solicitudes directas desde Safari.</p>'}}async function loadCovers(id){$('#coverResults').textContent='Cargando portadas...';try{let r=await fetch('https://www.steamgriddb.com/api/v2/grids/game/'+id+'?dimensions=600x900,342x482,660x930',{headers:{Authorization:'Bearer '+apiKey}});if(!r.ok)throw Error('Error '+r.status);let j=await r.json();covers=(j.data||[]).slice(0,12);$('#coverResults').innerHTML='<div class="coverchoices">'+covers.map((x,i)=>'<button data-cover="'+i+'"><img src="'+escapeHtml(x.thumb||x.url)+'"></button>').join('')+'</div>';document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{chosenCover=covers[Number(b.dataset.cover)].url;$('#coverInput').value=chosenCover;document.querySelectorAll('[data-cover]').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}catch(e){$('#coverResults').textContent='No se pudieron cargar las portadas: '+e.message}}function detail(id){let g=games.find(x=>x.id===id);if(!g)return;setAmbient('#304f67','#57345f');openModal((g.cover?'<img class="detail-cover" src="'+escapeHtml(g.cover)+'">':'')+'<h1>'+escapeHtml(g.title)+'</h1><div class="row"><span class="pill">'+(g.status==='played'?'Jugado · '+g.year:'Pendiente')+'</span>'+(g.status==='played'?'<span class="score '+color(g.score)+'" style="position:static">'+g.score+'</span>':'')+'</div>'+(g.description?'<div class="glass panel"><p>'+escapeHtml(g.description)+'</p></div>':'')+'<button class="full primary" id="editGame">Editar ficha</button><button class="full pill" id="deleteGame">Eliminar juego</button>');$('#editGame').onclick=()=>editor(id);$('#deleteGame').onclick=()=>{if(confirm('¿Eliminar este juego?')){games=games.filter(x=>x.id!==id);save();closeModal();render()}}}async function searchRawg(q){let node=$('#rawgResults');if(!node)return;if(!rawgKey){node.innerHTML='<p class="notice">Primero configurá tu clave gratuita de RAWG con el botón ⚙ Clave.</p>';return}if(rawgController)rawgController.abort();rawgController=new AbortController();node.innerHTML='<p class="notice">Buscando videojuegos...</p>';try{let u='https://api.rawg.io/api/games?key='+encodeURIComponent(rawgKey)+'&search='+encodeURIComponent(q)+'&page_size=12&search_precise=false';let res=await fetch(u,{signal:rawgController.signal});if(!res.ok)throw Error('RAWG respondió '+res.status);let data=await res.json();if(!$('#rawgResults'))return;let results=(data.results||[]).filter(g=>g.name);node.innerHTML=results.length?'<div style="margin-top:12px">'+results.map((g,i)=>'<button type="button" class="search-result" data-rawg="'+i+'" style="width:100%;background:transparent;color:white;text-align:left;border-left:0;border-right:0;border-top:0"><span style="display:flex;gap:10px;align-items:center">'+(g.background_image?'<img src="'+escapeHtml(g.background_image)+'" loading="lazy" style="width:52px;height:64px;object-fit:cover;border-radius:8px">':'<span>🎮</span>')+'<span><b>'+escapeHtml(g.name)+'</b><br><small class="muted">'+escapeHtml((g.released||'').slice(0,4))+' · '+escapeHtml((g.platforms||[]).slice(0,3).map(p=>p.platform.name).join(', '))+'</small></span></span><span>＋</span></button>').join('')+'</div>':'<p class="notice">No encontramos resultados. Podés cargar el juego manualmente.</p>';node.querySelectorAll('[data-rawg]').forEach(b=>b.onclick=()=>selectRawg(results[Number(b.dataset.rawg)]))}catch(e){if(e.name==='AbortError')return;if($('#rawgResults'))node.innerHTML='<p class="notice">No se pudo consultar RAWG: '+escapeHtml(e.message)+'. Verificá la clave y tu conexión. También podés cargar el juego manualmente.</p>'}}function selectRawg(g){$('#titleInput').value=g.name;chosenCover=g.background_image||'';$('#coverInput').value=chosenCover;$('#rawgResults').innerHTML='<p class="notice" style="color:#9effd9">✓ '+escapeHtml(g.name)+' seleccionado. Completá tu nota y guardalo.</p>'+(g.background_image?'<img src="'+escapeHtml(g.background_image)+'" style="max-height:170px;border-radius:12px;margin-top:10px">':'');if(g.released){let d=$('#rawgRelease');if(!d){d=document.createElement('p');d.id='rawgRelease';d.className='notice';$('#rawgResults').append(d)}d.textContent='Lanzamiento: '+g.released+' · Plataformas: '+(g.platforms||[]).map(x=>x.platform.name).join(', ')} }function configureRawg(){let k=prompt('Clave API personal de RAWG (obtenela gratis en rawg.io/apidocs). Se guarda en este iPhone, no en GitHub:',rawgKey);if(k!==null){rawgKey=k.trim();localStorage.setItem('gamelog-rawg-api',rawgKey);if($('#rawgResults'))$('#rawgResults').innerHTML='<p class="notice">Clave guardada. Escribí el nombre del juego arriba para buscar.</p>'}}function configureApi(){let k=prompt('Pegá tu clave API de SteamGridDB (se guarda solo en este iPhone):',apiKey);if(k!==null){apiKey=k.trim();localStorage.setItem('gamelog-api',apiKey);alert('Clave guardada localmente. La búsqueda requiere internet y puede estar limitada por CORS.')}}function exportData(){let blob=new Blob([JSON.stringify({version:1,games},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gamelog-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(e){try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.games))throw Error('Formato incorrecto');if(confirm('¿Reemplazar tu biblioteca con la copia importada?')){games=data.games;save();render()}}catch(err){alert('No se pudo importar: '+err.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
