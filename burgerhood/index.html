function pick(i){
 const [name,price,recipe,category,description]=products[i];
 if(category!==0 && category!==2){qty(i,1);return}
 const burger=category===0;
 custom.innerHTML='<h2>'+name+'</h2><p>'+description+'</p><p>'+money(price)+'</p>'+(burger?'<label><input name="fries" type="checkbox">Agregar papas (+$110)</label>'+formLabel('Medallón extra con cheddar','<select name="extra"><option value="0">Sin extra</option><option value="100">65 g · +$100</option><option value="200">130 g · +$200</option></select>'):formLabel('Primera bebida','<input required name="first" maxlength="40">')+formLabel('Segunda bebida','<input required name="second" maxlength="40">'))+formLabel('Indicación para esta unidad','<input name="instruction" maxlength="80" placeholder="Ej. Sin cebolla">')+'<div class="row"><button type="button" onclick="options.close()">Cancelar</button><button class="primary" id="confirmItem">Agregar</button></div>';
 function values(){return new FormData(custom)}
 function charge(f){return price+(f.has('fries')?110:0)+Number(f.get('extra')||0)}
 function update(){confirmItem.textContent='Agregar · '+money(charge(values()))}
 custom.onchange=update;update();
 custom.onsubmit=e=>{e.preventDefault();const f=values(),parts=[],used=recipe.slice();
 if(f.has('fries')){parts.push('con papas');used[3]++}
 if(+f.get('extra')){parts.push('extra '+(+f.get('extra')===100?'65':'130')+' g con cheddar');used[1]++;used[2]++}
 if(!burger)parts.push(f.get('first').trim()+' + '+f.get('second').trim());
 if(f.get('instruction').trim())parts.push(f.get('instruction').trim());
 let index=i;if(parts.length){const label=name+' · '+parts.join(' / ');index=products.findIndex(p=>p[0]===label && p[1]===charge(f));if(index<0){index=products.push([label,charge(f),used,category,description])-1}}
 options.close();qty(index,1)};options.showModal()
}
function order(){let amount=sumCart();if(!amount)return;let commission=channel==='PedidosYa'?fee:0;if(!Number.isFinite(commission)||commission<0||commission>amount)return alert('Revisá la comisión.');let used=ingredients.map((_,j)=>total(products.map((p,i)=>(cart[i]||0)*p[2][j])));if(used.some((v,j)=>v>db.stock[j]))return alert('Stock insuficiente. Revisá Inventario.');let o={id:db.orders.length+1,time:Date.now(),items:products.map((p,i)=>cart[i]?cart[i]+' × '+p[0]:'').filter(Boolean),channel,payment,note,amount,commission,cost:total(used.map((v,j)=>v*db.cost[j])),stage:0};db.orders.push(o);used.forEach((v,j)=>db.stock[j]-=v);cart=[];note='';fee=0;save();notify('Comanda #'+o.id+' enviada a cocina.')}
const stages=['En espera','En preparación','Lista','Entregada'];function kitchen(){let orders=db.orders.filter(o=>o.stage<3).reverse();return '<h2>Comandas activas · '+orders.length+'</h2><div class="grid">'+(orders.map(o=>'<article><span class="tag stage'+o.stage+'">'+stages[o.stage]+'</span><h2 style="margin-top:16px">Pedido #'+o.id+'</h2><small>'+o.channel+' · '+new Date(o.time).toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'})+'</small><p>'+o.items.map(esc).join('<br>')+'</p><b>'+esc(o.note)+'</b><button class="primary full" onclick="advance('+o.id+')">'+['Empezar preparación','Marcar lista','Entregar pedido'][o.stage]+'</button></article>').join('')||'<article>Las comandas confirmadas en el mostrador aparecen acá.</article>')+'</div>'}function advance(id){db.orders.find(o=>o.id===id).stage++;save()}
function stock(){return '<div class="cols"><section class="panel"><h2>Existencias</h2>'+ingredients.map((x,i)=>'<div class="row"><b>'+x+'</b><span>'+db.stock[i]+' unidades · '+money(db.cost[i])+'/u.</span></div>').join('')+'</section><form class="panel" onsubmit="purchase(event)"><h2>Registrar compra</h2>'+formLabel('Insumo',sel('ing',ingredients))+formLabel('Cantidad recibida','<input id="units" required type="number" min="1" step="1">')+formLabel('Costo total ($)','<input id="price" required type="number" min=".01" step=".01">')+formLabel('Proveedor','<input id="provider" required maxlength="80">')+formLabel('Pago',sel('method',['Efectivo','Transferencia']))+'<button class="primary">Guardar compra</button></form></div>'}
function purchase(e){e.preventDefault();let j=ing.selectedIndex,n=+units.value,p=+price.value;db.cost[j]=(db.cost[j]*db.stock[j]+p)/(db.stock[j]+n);db.stock[j]+=n;db.moves.push({time:Date.now(),kind:'Compra',label:provider.value+' · '+ingredients[j],amount:p,pay:method.value});save()}
function cash(){let today=day(Date.now()),os=db.orders.filter(o=>day(o.time)===today),ms=db.moves.filter(m=>day(m.time)===today),sales=total(os.map(o=>o.amount)),expected=total(os.filter(o=>o.payment==='Efectivo').map(o=>o.amount))-total(ms.filter(m=>m.pay==='Efectivo').map(m=>m.amount)),profit=sales-total(os.map(o=>o.cost+o.commission))-total(ms.filter(m=>m.kind==='Gasto').map(m=>m.amount));return '<h2>Resumen del día · '+today+'</h2><div class="grid">'+[['Ventas',sales],['Movimiento de efectivo',expected],['Resultado simulado¹',profit]].map(([k,v])=>'<article>'+k+'<b class="metric">'+money(v)+'</b></article>').join('')+'</div><small>¹ Ventas menos ingredientes según receta, comisiones y gastos cargados.</small><div class="cols" style="margin-top:20px"><section class="panel"><h2>Movimientos</h2>'+os.map(o=>'<div class="row"><span>#'+o.id+' · '+o.channel+' · '+o.payment+'</span><b>'+money(o.amount)+'</b></div>').join('')+ms.map(m=>'<div class="row">'+esc(m.label)+' · '+m.kind+'<b>−'+money(m.amount)+'</b></div>').join('')+(!os.length&&!ms.length?'Todavía no hay movimientos hoy.':'')+'<h2 style="margin-top:24px">Arqueo</h2><form onsubmit="countCash(event,'+expected+')">'+formLabel('Fondo inicial ($)','<input name="base" type="number" min="0" step=".01" required>')+formLabel('Efectivo contado ($)','<input name="actual" type="number" min="0" step=".01" required>')+'<button>Guardar arqueo</button></form>'+db.counts.filter(c=>c.date===today).map(c=>'<p>Diferencia de arqueo: '+money(c.diff)+'</p>').join('')+'</section><form class="panel" onsubmit="expense(event)"><h2>Registrar gasto</h2>'+formLabel('Concepto','<input name="label" required maxlength="80" placeholder="Ej. Servicios">')+formLabel('Importe ($)','<input name="amount" required type="number" min=".01" step=".01">')+formLabel('Pago',sel('method',['Efectivo','Transferencia']))+'<button class="primary">Guardar gasto</button></form></div>'}
function countCash(e,expected){e.preventDefault();let f=new FormData(e.target);db.counts.push({date:day(Date.now()),diff:+f.get('actual')-f.get('base')-expected});save()}function expense(e){e.preventDefault();let f=new FormData(e.target);db.moves.push({kind:'Gasto',time:Date.now(),label:f.get('label'),amount:+f.get('amount'),pay:method.value});save()}draw()
</script></html>
